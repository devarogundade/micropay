[build]
  command = "vite build"
  publish = "dist/client"
  # Netlify site base directory: code
  # Custom domain: code.micropay.website
  # Separate product / merchant card; same DATABASE_URL as app
[dev]
  command = "npm run dev"
  targetPort = 5000
  port = 8889

[[headers]]
  for = "/.well-known/x402.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[build]
  # Monorepo: Netlify cwd is repo root (packagePath only selects this config).
  command = "npm run build --workspace=code"
  publish = "code/dist/client"
  # Custom domain: code.micropay.website
[dev]
  command = "npm run dev"
  targetPort = 5000
  port = 8889

[[headers]]
  for = "/.well-known/x402.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

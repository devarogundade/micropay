[build]
  command = "npm run build"
  publish = "dist"
  # Base directory in Netlify UI: landing

[[headers]]
  for = "/.well-known/x402.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

# www → apex (attach www domain to this site, then redirect)
[[redirects]]
  from = "https://www.micropay.website/*"
  to = "https://micropay.website/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

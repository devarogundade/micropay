[build]
  # From monorepo root (CLI --filter landing or Netlify base = repo root):
  command = "npm run build --workspace=landing"
  publish = "landing/dist"
  # If Netlify UI base directory is `landing`, use instead:
  #   command = "npm run build"
  #   publish = "dist"

[[headers]]
  for = "/.well-known/x402.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

# www → apex (attach www domain to this site, then redirect)
[[redirects]]
  from = "https://www.micropay.website/*"
  to = "https://micropay.website/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

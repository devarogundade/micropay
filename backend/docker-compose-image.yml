name: micropay

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: micropay
      POSTGRES_USER: micropay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micropay -d micropay"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

  backend:
    image: devarogundade/micropay-backend:latest
    restart: unless-stopped
    init: true
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      NETWORK: ${NETWORK:-testnet}
      DATABASE_URL: postgresql://micropay:${POSTGRES_PASSWORD}@postgres:5432/micropay
      # Local Compose bootstraps a fresh development database. Set false when
      # using a production database managed by committed migrations.
      DATABASE_SYNC: ${DATABASE_SYNC:-true}
      DATABASE_SSL: "false"
      DATABASE_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      ZG_ROUTER_NETWORK: ${ZG_ROUTER_NETWORK:-testnet}
      ZG_ROUTER_API_KEY: ${ZG_ROUTER_API_KEY:?set ZG_ROUTER_API_KEY}
      X402_NETWORK: ${X402_NETWORK:-testnet}
      X402_PAY_TO: ${X402_PAY_TO:?set X402_PAY_TO}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PUBLIC_CODE_URL: ${PUBLIC_CODE_URL:-http://localhost:5000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000}
      WS_CORS_ORIGIN: ${WS_CORS_ORIGIN:-http://localhost:3000,http://localhost:5000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /app/.puya-tmp:rw,size=512m,uid=1000,gid=1000
      - /tmp:rw,size=64m,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s

  migrate:
    profiles: ["migration"]
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://micropay:${POSTGRES_PASSWORD}@postgres:5432/micropay
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
